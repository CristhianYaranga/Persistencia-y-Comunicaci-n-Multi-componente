# Deployment del backend reactivo Spring WebFlux
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: practica-s11
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend-webflux
          image: backend-webflux:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http-port
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
# Servicio NodePort para exposición externa (puerto 30080)
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: practica-s11
  labels:
    app: backend
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
