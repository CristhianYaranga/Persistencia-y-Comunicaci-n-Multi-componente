# Credenciales sensibles en Base64 compartidas entre MongoDB y el Backend
# PowerShell:
#   [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('admin_s11'))          -> YWRtaW5fczEx
#   [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('K8s$ecret2025!Lab')) -> SzhzJGVjcmV0MjAyNSFMYWI=
# Bash:
#   echo -n 'admin_s11' | base64          -> YWRtaW5fczEx
#   echo -n 'K8s$ecret2025!Lab' | base64  -> SzhzJGVjcmV0MjAyNSFMYWI=
# NOTA: En entornos productivos nunca se suben archivos Secret a repositorios Git.
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: practica-s11
type: Opaque
data:
  MONGO_INITDB_ROOT_USERNAME: YWRtaW5fczEx
  MONGO_INITDB_ROOT_PASSWORD: SzhzJGVjcmV0MjAyNSFMYWI=
